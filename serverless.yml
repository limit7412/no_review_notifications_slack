service: no-review-notifications-slack

plugins:
  - serverless-plugin-scripts

custom:
  defaultStage: dev
  # スケジュール実行は prod ステージでのみ有効にする。
  # それ以外のステージ(dev等)ではデプロイされるが EventBridge ルールは無効化される。
  scheduleEnabled:
    prod: true
  scripts:
    hooks:
      # パッケージング(zip化)直前に、Lambda互換のネイティブバイナリ bootstrap を
      # Docker内でビルドして取り出す。
      # set -e / rm -f は、前回ビルドの bootstrap が残っている状態で docker が失敗した
      # 場合に、それを掴んだままデプロイしてしまうのを防ぐため。プラグインは
      # execSync(= sh -c)で実行するので、既定では途中のコマンドが失敗しても後続に進み、
      # 最後の chmod が成功する限りフックは成功扱いになる。アーキテクチャを跨いで
      # 古いバイナリが残っていると Runtime.InvalidEntrypoint になる。
      "before:package:createDeploymentArtifacts": |
        set -e
        rm -f bootstrap
        docker build --platform linux/amd64 -t no-review-notifications-slack-build .
        id=$(docker create --platform linux/amd64 no-review-notifications-slack-build)
        docker cp "$id":/work/bootstrap ./bootstrap
        docker rm "$id"
        chmod +x bootstrap

provider:
  name: aws
  runtime: provided.al2023
  # ビルドに使う scala-cli 公式イメージが amd64 単一アーキのため x86_64 (#14)
  architecture: x86_64
  timeout: 300
  region: ap-northeast-1
  stage: ${opt:stage, self:custom.defaultStage}
  environment:
    ${file(./env.yml)}

package:
  patterns:
    - "!**"
    - bootstrap

functions:
  no_review_notifications_slack:
    handler: handler
    events:
      - schedule:
          rate: cron(0 8 * * ? *) # UTC
          enabled: ${self:custom.scheduleEnabled.${sls:stage}, false}
